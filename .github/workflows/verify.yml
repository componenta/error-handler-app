name: Verify error handler application integration
on:
  push:
    branches: [refactor/error-handler-v2]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      use_published_core:
        description: Install the released core through Composer instead of a branch checkout
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        if: ${{ !inputs.use_published_core }}
        with:
          repository: componenta/error-handler
          ref: refactor/error-handler-v2
          path: .deps/error-handler
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
          tools: composer:v2
      - if: ${{ !inputs.use_published_core }}
        run: composer config repositories.error-handler '{"type":"path","url":".deps/error-handler","options":{"symlink":false,"versions":{"componenta/error-handler":"2.0.0"}}}'
      - run: composer validate --strict
      - run: composer update --no-interaction --prefer-dist
      - run: composer audit --locked --no-dev --no-interaction
      - run: find src tests -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
      - run: composer test


  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        if: ${{ !inputs.use_published_core }}
        with:
          repository: componenta/error-handler
          ref: refactor/error-handler-v2
          path: .deps/error-handler
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring
          tools: composer:v2
          coverage: none
      - if: ${{ !inputs.use_published_core }}
        run: composer config repositories.error-handler '{"type":"path","url":".deps/error-handler","options":{"symlink":false,"versions":{"componenta/error-handler":"2.0.0"}}}'
      - run: composer require --dev --no-interaction --no-update 'componenta/di:dev-main'
      - run: composer update --no-interaction --prefer-dist
      - run: composer audit --locked --no-dev --no-interaction
      - run: composer test:integration
